<!DOCTYPE html>
<html>
    <head>
        <title>
            Website Layout and Grid Layout
        </title>

        <style>
            .header{
                background-color:rgb(13, 119, 119);
                text-align:center;
                padding: 20px;
                margin-bottom: 10px;
            }
            .navbar{
                background-color: rgb(185, 45, 45);
                padding: 5px;
                margin-top: 5px;
                text-align: center;
                
            }
            .navbar ul li{
                display:inline-block;
            }
            .navbar ul li a{
                color:wheat;
                text-decoration: none;
                margin-left:15px;
            }

            .grid-container{
                margin-top:5px;
                display:grid;
                width:100%;
                grid-template-columns: 19.5% 60% 19.5%;
                row-gap: .5%;
                grid-template-rows:150px 400px;
               
                column-gap:0.5%;
            }
            .grid-container-header{
                display:inline-grid;
                width:100%;
                max-height:600px;
                grid-template-columns: 60% 40%;
               
            }
            .header-text{
                text-align: center;
            }
            .header-img{
                background-color: red;
               
                background-position: center;
                background-size: cover;
                background-image: url('Images/Animals/Cat.jpg');
            }
           

            .side-content{
                background-color: blueviolet;
                padding: 20px;
                text-align: center;
            
                
                
            }
            .main-content{
                background-color: purple;
                padding: 20px;
                
              
            }
            .footer{
                background-color:skyblue ;
                padding: 20px;
                margin-top:5px;
                
                
            }
        </style>
    </head>

    <body>

        <div class="grid-container-header">
            <div class ="header-img">
                <!-- <img src="Images\Locations\Palawan.jpg"> -->
            </div>

            <div class="header-text">
                <h1>This is a header</h1>
                <p>Sub text </p>
            </div>
        </div>
        




        <div class="navbar">
                <ul>
                    <li ><a href="#">Home</a></li>
                    <li ><a href="#">Products</a></li>
                    <li ><a href="#">Services</a></li>
                    <li ><a href="#">Contact Us</a></li>
                    <li ><a href="#">About Us</a></li>
                </ul>
        </div>

        <div class="grid-container">
        
        
            <div class="side-content">
                <h4>This is the side content</h4>
            </div>

            <div class="main-content">
                <h4>This is the main-content</h4>
            </div>
            
            <div class="side-content">
                <h4>This is the side content</h4>
            </div>
            <div class="side-content">
                <h4>This is the side content</h4>
            </div>

            <div class="main-content">
                <h4>This is the main-content</h4>
            </div>
            
            <div class="side-content">
                <h4>This is the side content</h4>
            </div>
        </div>
            
       

        <div class="footer">
            <h4>This is the footer</h4>
        </div>

    </body>
</html>
