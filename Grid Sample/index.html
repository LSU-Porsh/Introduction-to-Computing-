<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .container {
        padding: 10px;
        background-color: grey;
        width: 400px;
        height: 400px;
        display: grid;
        gap: 2px;
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-rows: 20% 10% 60% 10%;
        grid-template-areas:
          "item1 item1 item1"
          "item2 item2 item2"
          "item3 item4 item5"
          "item6 item6 item6";
      }
      #item1 {
        grid-area: item1;
        background-color: maroon;
      }
      #item2 {
        grid-area: item2;
        background-color: orange;
      }
      #item3 {
        grid-area: item3;
        background-color: pink;
      }
      #item4 {
        grid-area: item4;
        background-color: rgb(119, 9, 127);
      }
      #item5 {
        grid-area: item5;
        background-color: rgb(194, 48, 227);
      }
      #item6 {
        grid-area: item6;
        background-color: rgb(177, 6, 129);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="item1">1</div>
      <div id="item2">2</div>
      <div id="item3">3</div>
      <div id="item4">4</div>
      <div id="item5">5</div>
      <div id="item6">6</div>
    </div>
  </body>
</html>
