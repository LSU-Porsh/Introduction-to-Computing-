<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- The header contains introductory content for the page or a section. -->
    <header></header>
    <!-- The nav element groups links for navigating the site or page. -->
    <nav></nav>
    <!-- The aside contains related content that is separate from the main flow. -->
    <aside>
      <!-- An article is self-contained content that could stand on its own. -->
      <article></article>
    </aside>
    <!-- The main element contains the page's primary, unique content. -->
    <main>
      <!-- A section groups content around a common theme or topic. -->
      <section></section>
      <!-- Another thematic section of the page. -->
      <section></section>
    </main>
    <!-- The footer contains closing or supplementary information for the page. -->
    <footer></footer>
  </body>
</html>
