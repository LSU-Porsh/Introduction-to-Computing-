<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Positioning in CSS</title>
    <link rel="stylesheet" href="position.css">
</head>
<body>
    <header>
        <h1>CSS Positioning Techniques</h1>
    </header>

    <main>
        <section class="static-position">
            <h2>Static Positioning</h2>
            <div class="box static">I am a static box.</div>
        </section>

        <section class="relative-position">
            <h2>Relative Positioning</h2>
            <div class="box relative">I am a relative box.</div>
        </section>

        <section class="absolute-position">
            <h2>Absolute Positioning</h2>
            <div class="box absolute">I am an absolute box.</div>
        </section>

        <section class="fixed-position">
            <h2>Fixed Positioning</h2>
            <div class="box fixed">I am a fixed box.</div>
        </section>

        <section class="sticky-position">
            <h2>Sticky Positioning</h2>
            <div class="box sticky">I am a sticky box.</div>
        </section>
    </main>

    <footer>
        <p>Created by [Your Name]</p>
    </footer>
</body>
</html>
