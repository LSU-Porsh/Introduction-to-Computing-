<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Layouts in CSS</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>
    <header>
        <h1>CSS Layout Techniques</h1>
        <nav>
            <ul>
                <li><a href="#flexbox">Flexbox Layout</a></li>
                <li><a href="#grid">Grid Layout</a></li>
                <li><a href="#float">Float Layout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="flexbox">
            <h2>Flexbox Layout</h2>
            <div class="flex-container">
                <div class="flex-item">Item 1</div>
                <div class="flex-item">Item 2</div>
                <div class="flex-item">Item 3</div>
            </div>
        </section>

        <section id="grid">
            <h2>Grid Layout</h2>
            <div class="grid-container">
                <div class="grid-item">Grid Item 1</div>
                <div class="grid-item">Grid Item 2</div>
                <div class="grid-item">Grid Item 3</div>
                <div class="grid-item">Grid Item 4</div>
            </div>
        </section>

        <section id="float">
            <h2>Float Layout</h2>
            <div class="float-container">
                <div class="float-item">Float Item 1</div>
                <div class="float-item">Float Item 2</div>
                <div class="float-item">Float Item 3</div>
                <div class="float-item">Float Item 4</div>
            </div>
        </section>
    </main>

    <footer>
        <p>Created by [Your Name]</p>
    </footer>
</body>
</html>
