<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Understanding the CSS Box Model</title>
    <link rel="stylesheet" href="Border Sample/boxmodel.css" />
  </head>
  <body>
    <header>
      <h1>CSS Box Model and Border Properties</h1>
    </header>

    <main>
      <section class="box" id="box1">
        <h2>Box 1</h2>
        <p>This box demonstrates the default box model.</p>
      </section>

      <section class="box" id="box2">
        <h2>Box 2</h2>
        <p>This box uses padding.</p>
      </section>

      <section class="box" id="box3">
        <h2>Box 3</h2>
        <p>This box uses borders.</p>
      </section>

      <section class="box" id="box4">
        <h2>Box 4</h2>
        <p>This box combines margin, padding, and border.</p>
      </section>
    </main>

    <footer>
      <p>Created by [Your Name]</p>
    </footer>
  </body>
</html>
